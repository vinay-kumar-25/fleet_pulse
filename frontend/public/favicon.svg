<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Emerald to Cyan Pulse Gradient -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer Telemetry Ring / Speedometer Track -->
  <path d="M 130 256 A 126 126 0 1 1 382 256" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round"/>
  <path d="M 130 256 A 126 126 0 0 1 340 156" fill="none" stroke="url(#pulse-grad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pulse / ECG Wave Line (Engine Pulse & Vehicle Signal) -->
  <path d="M 120 256 L 195 256 L 225 175 L 265 335 L 298 215 L 322 256 L 392 256" 
        fill="none" 
        stroke="url(#pulse-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Active Telemetry Signal Node -->
  <circle cx="265" cy="335" r="14" fill="#06b6d4" />
</svg>
